<!doctype html>
<html lang="en" data-voltara-game>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sweep Grid — VOLTARA</title>
<link rel="stylesheet" href="../_shared/vt.css" />
<style>
  .board { display: grid; gap: 2px; width: var(--w); height: var(--h); touch-action: manipulation; }
  .c { border: 0; padding: 0; border-radius: 2px; background: #1b1e22; font-family: var(--mono); font-weight: 700; font-size: calc(var(--cs) * .5); display: grid; place-items: center; transition: background .08s; position: relative; }
  .c:hover { background: #24282d; }
  .c.open { background: #0d0f11; cursor: default; }
  .c.f::after { content: ''; width: 36%; height: 44%; background: #ffb547; clip-path: polygon(0 0, 100% 30%, 0 60%); position: absolute; left: 34%; top: 24%; }
  .c.f::before { content: ''; position: absolute; left: 32%; top: 22%; width: 2px; height: 58%; background: #ffb547; }
  .c.mine { background: #ff5c5c; }
  .c.mine::after { content: ''; width: 40%; height: 40%; border-radius: 50%; background: #0a0b0c; }
  .c.wrong { background: #3a1f22; }
  .n1 { color: #3ee6ff; } .n2 { color: #c8ff2e; } .n3 { color: #ffb547; } .n4 { color: #8b7dff; } .n5 { color: #ff5c5c; } .n6 { color: #3ee6ff; } .n7 { color: #eef0f2; } .n8 { color: #8d959e; }
  .mode { display: flex; gap: 6px; }
  .mode .vt-btn[aria-pressed="true"] { border-color: #ffb547; color: #ffb547; }
</style>
</head>
<body>
<div class="vt-app">
  <div class="vt-hud">
    <div class="vt-stat accent"><b>Mines</b><span id="mines">0</span></div>
    <div class="vt-stat"><b>Time</b><span id="time">0</span></div>
    <div class="vt-spacer"></div>
    <div class="mode">
      <button class="vt-btn vt-btn--sm" id="flagMode" aria-pressed="false" title="Tap to flag instead of reveal">Flag mode</button>
      <button class="vt-btn vt-btn--sm" id="new">New</button>
    </div>
  </div>
  <div class="vt-stage" id="stage">
    <div class="vt-center"><div class="board" id="board" aria-label="Mine grid"></div></div>
    <div class="vt-overlay" id="ov" hidden></div>
  </div>
</div>
<script src="../_shared/vt.js"></script>
<script>
(function () {
  var LEVELS = { easy: { c: 9, r: 9, m: 10, name: 'Easy' }, medium: { c: 16, r: 12, m: 30, name: 'Medium' }, hard: { c: 22, r: 14, m: 60, name: 'Hard' } };
  var board = VT.$('#board'), ov = VT.$('#ov'), stage = VT.$('#stage');
  var el = { mines: VT.$('#mines'), time: VT.$('#time'), flag: VT.$('#flagMode') };
  var L, cells, first, over, t0, timer, flagMode = false, openCount;

  function fit() {
    if (!L) return;
    var r = stage.getBoundingClientRect();
    var cs = Math.floor(Math.min((r.width - 20) / L.c, (r.height - 20) / L.r, 44));
    board.style.setProperty('--cs', cs + 'px');
    board.style.setProperty('--w', (cs * L.c + 2 * (L.c - 1)) + 'px');
    board.style.setProperty('--h', (cs * L.r + 2 * (L.r - 1)) + 'px');
  }
  new ResizeObserver(fit).observe(stage);

  function nbrs(i) {
    var x = i % L.c, y = (i / L.c) | 0, out = [];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      var nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < L.c && ny < L.r) out.push(ny * L.c + nx);
    }
    return out;
  }

  function newGame(key) {
    VT.hide(ov);
    L = LEVELS[key]; L.key = key;
    cells = []; first = true; over = false; openCount = 0; t0 = 0;
    clearInterval(timer); el.time.textContent = '0';
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + L.c + ', 1fr)';
    for (var i = 0; i < L.c * L.r; i++) {
      var b = document.createElement('button');
      b.className = 'c'; b.dataset.i = i;
      b.setAttribute('aria-label', 'Hidden');
      board.appendChild(b);
      cells.push({ el: b, mine: false, open: false, flag: false, n: 0 });
    }
    fit(); counts();
  }

  function plant(safe) {
    var avoid = nbrs(safe).concat(safe);
    var pool = [];
    for (var i = 0; i < cells.length; i++) if (avoid.indexOf(i) === -1) pool.push(i);
    VT.shuffle(pool).slice(0, L.m).forEach(function (i) { cells[i].mine = true; });
    cells.forEach(function (c, i) { c.n = nbrs(i).filter(function (j) { return cells[j].mine; }).length; });
  }

  function counts() { el.mines.textContent = L.m - cells.filter(function (c) { return c.flag; }).length; }

  function reveal(i) {
    var c = cells[i];
    if (over || c.open || c.flag) return;
    if (first) { first = false; plant(i); t0 = Date.now(); timer = setInterval(function () { el.time.textContent = Math.floor((Date.now() - t0) / 1000); }, 250); }
    if (c.mine) return lose(i);
    var stack = [i];
    while (stack.length) {
      var k = stack.pop(), cc = cells[k];
      if (cc.open || cc.flag) continue;
      cc.open = true; openCount++;
      cc.el.classList.add('open');
      cc.el.textContent = cc.n || '';
      if (cc.n) cc.el.classList.add('n' + cc.n);
      cc.el.setAttribute('aria-label', cc.n ? cc.n + ' adjacent mines' : 'Empty');
      if (!cc.n) nbrs(k).forEach(function (j) { if (!cells[j].open) stack.push(j); });
    }
    VT.beep(520, 0.02, 'triangle', 0.03);
    if (openCount === cells.length - L.m) win();
  }

  // Chord: clicking an opened number with the right number of flags reveals its neighbours.
  function chord(i) {
    var c = cells[i];
    if (!c.open || !c.n) return;
    var ns = nbrs(i), flags = ns.filter(function (j) { return cells[j].flag; }).length;
    if (flags === c.n) ns.forEach(reveal);
  }

  function toggleFlag(i) {
    var c = cells[i];
    if (over || c.open) return;
    c.flag = !c.flag;
    c.el.classList.toggle('f', c.flag);
    c.el.setAttribute('aria-label', c.flag ? 'Flagged' : 'Hidden');
    VT.beep(c.flag ? 700 : 400, 0.03, 'square', 0.03);
    counts();
  }

  function lose(i) {
    over = true; clearInterval(timer);
    cells.forEach(function (c, k) {
      if (c.mine && !c.flag) c.el.classList.add('mine');
      if (!c.mine && c.flag) c.el.classList.add('wrong');
    });
    cells[i].el.style.outline = '2px solid #fff';
    VT.beep(90, 0.4, 'sawtooth', 0.08);
    setTimeout(function () {
      VT.overlay(ov, { eyebrow: L.name, title: 'Mine triggered', stats: [['Cleared', Math.round((openCount / (cells.length - L.m)) * 100) + '%']], button: 'Try again', onAction: function () { newGame(L.key); }, secondary: { label: 'Change size', onAction: menu } });
    }, 700);
  }

  function win() {
    over = true; clearInterval(timer);
    var secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
    cells.forEach(function (c) { if (c.mine && !c.flag) { c.flag = true; c.el.classList.add('f'); } });
    counts();
    var r = VT.submit(secs, { key: 'time-' + L.key, lowerIsBetter: true });
    VT.beep(880, 0.1, 'triangle'); setTimeout(function () { VT.beep(1320, 0.16, 'triangle'); }, 120);
    setTimeout(function () {
      VT.overlay(ov, { eyebrow: r.isNew && !r.first ? 'New best · ' + L.name : 'Cleared · ' + L.name, title: secs + 's', stats: [['Best', r.best + 's', true]], button: 'Play again', onAction: function () { newGame(L.key); }, secondary: { label: 'Change size', onAction: menu } });
    }, 500);
  }

  var pressT = 0, pressI = -1, longFired = false;
  board.addEventListener('pointerdown', function (e) {
    var t = e.target.closest('.c'); if (!t || e.button === 2) return;
    pressI = +t.dataset.i; longFired = false;
    if (e.pointerType !== 'mouse') pressT = setTimeout(function () { longFired = true; toggleFlag(pressI); if (navigator.vibrate) navigator.vibrate(20); }, 380);
  });
  board.addEventListener('pointerup', function () { clearTimeout(pressT); });
  board.addEventListener('pointerleave', function () { clearTimeout(pressT); });
  board.addEventListener('click', function (e) {
    var t = e.target.closest('.c'); if (!t) return;
    if (longFired) { longFired = false; return; }
    var i = +t.dataset.i;
    if (cells[i].open) return chord(i);
    if (flagMode) toggleFlag(i); else reveal(i);
  });
  board.addEventListener('contextmenu', function (e) { var t = e.target.closest('.c'); if (t) { e.preventDefault(); if (e.pointerType !== 'touch') toggleFlag(+t.dataset.i); } });
  el.flag.addEventListener('click', function () { flagMode = !flagMode; el.flag.setAttribute('aria-pressed', flagMode); });
  VT.$('#new').addEventListener('click', menu);

  function menu() {
    VT.overlay(ov, {
      eyebrow: 'VOLTARA Original', title: 'Sweep Grid',
      sub: 'Reveal every safe cell. Numbers count adjacent mines. Right-click or long-press to flag. Your first reveal is always safe.<br><br><span style="display:flex;gap:8px;justify-content:center"><button class="vt-btn vt-btn--sm" data-l="easy">Easy 9×9</button><button class="vt-btn vt-btn--sm" data-l="medium">Medium 16×12</button><button class="vt-btn vt-btn--sm" data-l="hard">Hard 22×14</button></span>',
      hint: 'Best times are saved per size',
    });
    ov.querySelectorAll('[data-l]').forEach(function (b) { b.addEventListener('click', function () { newGame(b.dataset.l); }); });
    setTimeout(function () { var b = ov.querySelector('[data-l="easy"]'); if (b) b.focus(); }, 30);
  }

  newGame('easy');
  menu();
  VT.ready();
})();
</script>
</body>
</html>
