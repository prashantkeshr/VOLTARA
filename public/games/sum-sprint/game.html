<!doctype html>
<html lang="en" data-voltara-game>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sum Sprint — VOLTARA</title>
<link rel="stylesheet" href="../_shared/vt.css" />
<style>
  .wrap { display: grid; gap: clamp(14px, 3vh, 28px); justify-items: center; width: min(520px, 100%); }
  .target { display: grid; justify-items: center; gap: 4px; }
  .target b { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; color: var(--muted); font-weight: 500; }
  .target span { font-family: var(--display); font-size: clamp(56px, 14vmin, 96px); font-weight: 700; line-height: 1; color: var(--lime); letter-spacing: -.03em; }
  .sum { font-family: var(--mono); font-size: 14px; color: var(--muted); min-height: 1.4em; }
  .sum.over { color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .t { aspect-ratio: 1.3; border-radius: 6px; border: 1px solid var(--line2); background: #111315; font-family: var(--display); font-size: clamp(22px, 5vmin, 34px); font-weight: 600; transition: border-color .1s, background .1s, transform .08s; }
  .t:hover { border-color: #5d656d; }
  .t:active { transform: scale(.96); }
  .t.sel { background: rgba(200,255,46,.12); border-color: var(--lime); color: var(--lime); }
  .t.pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .timebar { height: 3px; background: var(--line); }
  .timebar i { display: block; height: 100%; background: var(--lime); }
</style>
</head>
<body>
<div class="vt-app">
  <div class="vt-hud">
    <div class="vt-stat accent"><b>Score</b><span id="score">0</span></div>
    <div class="vt-stat"><b>Level</b><span id="level">1</span></div>
    <div class="vt-stat"><b>Solved</b><span id="solved">0</span></div>
    <div class="vt-spacer"></div>
    <div class="vt-stat"><b>Time</b><span id="time">60</span></div>
    <div class="vt-stat"><b>Best</b><span id="best">–</span></div>
  </div>
  <div class="timebar"><i id="bar"></i></div>
  <div class="vt-stage">
    <div class="vt-center">
      <div class="wrap">
        <div class="target"><b>TARGET</b><span id="target">0</span></div>
        <div class="sum" id="sum" aria-live="polite">Select tiles</div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="vt-overlay" id="ov" hidden></div>
  </div>
</div>
<script src="../_shared/vt.js"></script>
<script>
(function () {
  var START = 60, COUNT = 12;
  var grid = VT.$('#grid'), ov = VT.$('#ov'), tgtEl = VT.$('#target'), sumEl = VT.$('#sum');
  var el = { score: VT.$('#score'), level: VT.$('#level'), solved: VT.$('#solved'), time: VT.$('#time'), best: VT.$('#best'), bar: VT.$('#bar') };
  var s = null;

  function maxTile() { return Math.min(9 + s.level * 2, 25); }

  function rollTile() { return VT.randInt(1, maxTile()); }

  // Pick a target that is guaranteed reachable: the sum of 2–4 existing tiles.
  function newTarget() {
    var k = Math.min(4, 2 + Math.floor(s.level / 3));
    var idx = VT.shuffle(s.tiles.map(function (_, i) { return i; })).slice(0, VT.randInt(2, k));
    s.target = idx.reduce(function (a, i) { return a + s.tiles[i]; }, 0);
    tgtEl.textContent = s.target;
  }

  function render(popIdx) {
    grid.innerHTML = '';
    s.tiles.forEach(function (v, i) {
      var b = document.createElement('button');
      b.className = 't' + (s.sel.indexOf(i) !== -1 ? ' sel' : '') + (popIdx && popIdx.indexOf(i) !== -1 ? ' pop' : '');
      b.textContent = v;
      b.dataset.i = i;
      b.setAttribute('aria-pressed', s.sel.indexOf(i) !== -1);
      grid.appendChild(b);
    });
    var sum = s.sel.reduce(function (a, i) { return a + s.tiles[i]; }, 0);
    sumEl.textContent = s.sel.length ? s.sel.map(function (i) { return s.tiles[i]; }).join(' + ') + ' = ' + sum : 'Select tiles';
    sumEl.classList.toggle('over', sum > s.target);
  }

  function pick(i) {
    if (!s || !loop.running) return;
    var at = s.sel.indexOf(i);
    if (at !== -1) s.sel.splice(at, 1); else s.sel.push(i);
    var sum = s.sel.reduce(function (a, j) { return a + s.tiles[j]; }, 0);
    if (sum === s.target) {
      var used = s.sel.slice();
      s.score += 10 * used.length * s.level;
      s.solved++;
      s.time = Math.min(START, s.time + 2);
      if (s.solved % 5 === 0) s.level++;
      used.forEach(function (j) { s.tiles[j] = rollTile(); });
      s.sel = [];
      VT.beep(880, 0.08, 'triangle', 0.06);
      newTarget(); render(used); hud();
      return;
    }
    if (sum > s.target) {
      VT.beep(160, 0.12, 'sawtooth', 0.05);
      render();
      setTimeout(function () { s.sel = []; render(); }, 280);
      return;
    }
    VT.beep(500 + sum * 5, 0.03, 'triangle', 0.03);
    render();
  }

  function hud() {
    el.score.textContent = VT.fmt(s.score);
    el.level.textContent = s.level;
    el.solved.textContent = s.solved;
    el.time.textContent = Math.ceil(Math.max(0, s.time));
    el.bar.style.width = VT.clamp(s.time / START, 0, 1) * 100 + '%';
  }

  var loop = VT.loop(function (dt) { s.time -= dt; if (s.time <= 0) end(); hud(); });

  function start() {
    VT.hide(ov);
    s = { score: 0, level: 1, solved: 0, time: START, sel: [], tiles: [], target: 0 };
    for (var i = 0; i < COUNT; i++) s.tiles.push(rollTile());
    newTarget(); render(); hud(); loop.start();
  }

  function end() {
    loop.stop();
    var r = VT.submit(s.score);
    showBest();
    VT.overlay(ov, {
      eyebrow: r.isNew && !r.first ? 'New best' : 'Time up',
      title: VT.fmt(s.score),
      stats: [['Solved', s.solved], ['Level', s.level], ['Best', VT.fmt(r.best), true]],
      button: 'Play again', onAction: start, hint: 'Space to restart',
    });
  }
  function showBest() { var b = VT.getBest(); el.best.textContent = b === null ? '–' : VT.fmt(b); }

  grid.addEventListener('click', function (e) { var t = e.target.closest('.t'); if (t) pick(+t.dataset.i); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !ov.hidden) { var b = ov.querySelector('[data-act="main"]'); if (b) { e.preventDefault(); b.click(); } }
  });
  VT.onPause(function () {
    if (loop.running) { loop.stop(); VT.overlay(ov, { eyebrow: 'Paused', title: 'Sum Sprint', button: 'Resume', onAction: function () { VT.hide(ov); loop.start(); } }); }
  });

  showBest();
  VT.overlay(ov, {
    eyebrow: 'VOLTARA Original', title: 'Sum Sprint',
    sub: 'Select tiles that add up exactly to the target. Every solve adds 2 seconds. Overshoot and your selection resets.',
    button: 'Start', onAction: start, hint: 'Click · Tap',
  });
  if (VT.preview) setTimeout(function () { s.sel = [1, 6]; render(); }, 100);
  VT.ready();
})();
</script>
</body>
</html>
