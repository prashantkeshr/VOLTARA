<!doctype html>
<html lang="en" data-voltara-game>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Number Merge — VOLTARA</title>
<link rel="stylesheet" href="../_shared/vt.css" />
<style>
  .board { position: relative; width: var(--size); aspect-ratio: 1; background: #0d0f11; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
  .slot, .tile { position: absolute; width: var(--cell); height: var(--cell); border-radius: 6px; }
  .slot { background: #131619; border: 1px solid #1c1f23; }
  .tile { display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: calc(var(--cell) * .38); transition: transform .11s ease-out; will-change: transform; }
  .tile.new { animation: pop .16s ease-out; }
  .tile.merged { animation: bump .16s ease-out; }
  @keyframes pop { from { opacity: 0; scale: .4; } }
  @keyframes bump { 50% { scale: 1.12; } }
  .tile[data-d="3"] { font-size: calc(var(--cell) * .32); }
  .tile[data-d="4"] { font-size: calc(var(--cell) * .26); }
  .tile[data-d="5"] { font-size: calc(var(--cell) * .22); }
</style>
</head>
<body>
<div class="vt-app">
  <div class="vt-hud">
    <div class="vt-stat accent"><b>Score</b><span id="score">0</span></div>
    <div class="vt-stat"><b>Top tile</b><span id="top">2</span></div>
    <div class="vt-spacer"></div>
    <div class="vt-stat"><b>Best</b><span id="best">–</span></div>
    <button class="vt-btn vt-btn--sm" id="undo" disabled>Undo</button>
    <button class="vt-btn vt-btn--sm" id="new">New</button>
  </div>
  <div class="vt-stage" id="stage">
    <div class="vt-center"><div class="board" id="board" role="application" aria-label="Number Merge board. Use arrow keys to slide."></div></div>
    <div class="vt-overlay" id="ov" hidden></div>
  </div>
</div>
<script src="../_shared/vt.js"></script>
<script>
(function () {
  var SIZE = 4, GAP = 10;
  var board = VT.$('#board'), ov = VT.$('#ov'), stage = VT.$('#stage');
  var el = { score: VT.$('#score'), top: VT.$('#top'), best: VT.$('#best'), undo: VT.$('#undo') };
  var tiles = [], nextId = 1, score = 0, prev = null, won = false, over = false, cell = 60, nodes = {};

  // Colour ramp: graphite → violet → cyan → lime, with dark text on bright tiles.
  var RAMP = { 2: ['#1d2024', '#c6ccd2'], 4: ['#262a2f', '#e2e6ea'], 8: ['#3a3170', '#fff'], 16: ['#4b3fa0', '#fff'], 32: ['#6556d6', '#fff'], 64: ['#8b7dff', '#0a0b0c'], 128: ['#1e6f80', '#fff'], 256: ['#2a9bb3', '#0a0b0c'], 512: ['#3ee6ff', '#0a0b0c'], 1024: ['#9ee63a', '#0a0b0c'], 2048: ['#c8ff2e', '#0a0b0c'] };
  function color(v) { return RAMP[v] || ['#ffffff', '#0a0b0c']; }

  function fit() {
    var r = stage.getBoundingClientRect();
    var size = Math.floor(Math.min(r.width - 24, r.height - 24, 560));
    board.style.setProperty('--size', size + 'px');
    GAP = Math.max(6, Math.round(size * 0.022));
    cell = (size - 2 - GAP * (SIZE + 1)) / SIZE;
    board.style.setProperty('--cell', cell + 'px');
    layoutSlots();
    render(true);
  }

  function pos(r, c) { return 'translate(' + (GAP + c * (cell + GAP)) + 'px,' + (GAP + r * (cell + GAP)) + 'px)'; }

  function layoutSlots() {
    board.querySelectorAll('.slot').forEach(function (s) { s.remove(); });
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var s = document.createElement('div'); s.className = 'slot'; s.style.transform = pos(r, c); board.prepend(s);
    }
  }

  function at(r, c) { return tiles.find(function (t) { return t.r === r && t.c === c && !t.gone; }); }

  function addRandom() {
    var free = [];
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (!at(r, c)) free.push([r, c]);
    if (!free.length) return;
    var p = free[VT.randInt(0, free.length - 1)];
    tiles.push({ id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r: p[0], c: p[1], isNew: true });
  }

  function snapshot() { return { tiles: tiles.filter(function (t) { return !t.gone; }).map(function (t) { return { id: t.id, v: t.v, r: t.r, c: t.c }; }), score: score }; }

  function move(dir) {
    if (over || !ov.hidden) return;
    var before = snapshot();
    var vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
    tiles = tiles.filter(function (t) { return !t.gone; });
    tiles.forEach(function (t) { t.isNew = false; t.merged = false; });
    var moved = false, gained = 0;
    var order = [0, 1, 2, 3];
    if (vec[0] === 1 || vec[1] === 1) order.reverse();
    order.forEach(function (a) {
      order.forEach(function (b) {
        var r = vec[0] ? a : b, c = vec[0] ? b : a;
        var t = at(r, c);
        if (!t) return;
        var nr = r, nc = c;
        while (true) {
          var tr = nr + vec[0], tc = nc + vec[1];
          if (tr < 0 || tc < 0 || tr >= SIZE || tc >= SIZE) break;
          var o = at(tr, tc);
          if (!o) { nr = tr; nc = tc; continue; }
          if (o.v === t.v && !o.merged && !o.mergeLock) {
            nr = tr; nc = tc;
            o.v *= 2; o.merged = true; o.mergeLock = true; t.gone = true;
            gained += o.v;
          }
          break;
        }
        if (nr !== r || nc !== c) moved = true;
        t.r = nr; t.c = nc;
      });
    });
    tiles.forEach(function (t) { delete t.mergeLock; });
    if (!moved) return;
    prev = before;
    el.undo.disabled = false;
    score += gained;
    if (gained) VT.beep(300 + Math.log2(gained) * 40, 0.06, 'triangle', 0.05); else VT.beep(200, 0.02, 'triangle', 0.02);
    render();
    setTimeout(function () {
      tiles = tiles.filter(function (t) { return !t.gone; });
      addRandom();
      render();
      check();
    }, 115);
  }

  function canMove() {
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var t = at(r, c); if (!t) return true;
      var rt = at(r, c + 1), dn = at(r + 1, c);
      if ((rt && rt.v === t.v) || (dn && dn.v === t.v)) return true;
    }
    return false;
  }

  function check() {
    var top = Math.max.apply(null, tiles.map(function (t) { return t.v; }));
    if (top >= 2048 && !won) {
      won = true;
      VT.submit(score);
      VT.overlay(ov, { eyebrow: '2048 reached', title: 'Signal maxed', stats: [['Score', VT.fmt(score), true]], button: 'Keep going', onAction: function () { VT.hide(ov); }, secondary: { label: 'New game', onAction: newGame } });
      return;
    }
    if (!canMove()) {
      over = true;
      var r = VT.submit(score);
      showBest();
      VT.beep(150, 0.3, 'sawtooth', 0.06);
      VT.overlay(ov, {
        eyebrow: r.isNew && !r.first ? 'New best' : 'Board locked',
        title: VT.fmt(score),
        stats: [['Top tile', top], ['Best', VT.fmt(r.best), true]],
        button: 'New game', onAction: newGame,
        secondary: prev ? { label: 'Undo last move', onAction: function () { VT.hide(ov); undo(); } } : null,
      });
    }
  }

  function render(noAnim) {
    var live = {};
    tiles.forEach(function (t) {
      var n = nodes[t.id];
      if (!n) { n = document.createElement('div'); n.className = 'tile'; board.appendChild(n); nodes[t.id] = n; }
      live[t.id] = true;
      var col = color(t.v);
      n.style.background = col[0]; n.style.color = col[1];
      n.style.boxShadow = t.v >= 1024 ? '0 0 24px ' + col[0] + '66' : 'none';
      n.textContent = t.v; n.dataset.d = String(t.v).length;
      if (noAnim) n.style.transition = 'none';
      n.style.transform = pos(t.r, t.c);
      if (noAnim) { void n.offsetWidth; n.style.transition = ''; }
      n.classList.toggle('new', !!t.isNew);
      n.classList.toggle('merged', !!t.merged && !t.gone);
      n.style.zIndex = t.gone ? 1 : 2;
    });
    Object.keys(nodes).forEach(function (id) { if (!live[id]) { nodes[id].remove(); delete nodes[id]; } });
    el.score.textContent = VT.fmt(score);
    el.top.textContent = tiles.length ? Math.max.apply(null, tiles.map(function (t) { return t.v; })) : 2;
  }

  function undo() {
    if (!prev) return;
    tiles = prev.tiles.map(function (t) { return { id: t.id, v: t.v, r: t.r, c: t.c }; });
    score = prev.score; prev = null; over = false; el.undo.disabled = true;
    render();
  }

  function showBest() { var b = VT.getBest(); el.best.textContent = b === null ? '–' : VT.fmt(b); }

  function newGame() {
    VT.hide(ov);
    tiles = []; score = 0; prev = null; won = false; over = false; el.undo.disabled = true;
    addRandom(); addRandom(); render(); showBest();
  }

  window.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
    if (map[e.code]) { e.preventDefault(); move(map[e.code]); }
    if (e.code === 'KeyU') undo();
  });
  var sx = 0, sy = 0, tracking = false;
  board.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; tracking = true; board.setPointerCapture(e.pointerId); });
  board.addEventListener('pointerup', function (e) {
    if (!tracking) return; tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  el.undo.addEventListener('click', undo);
  VT.$('#new').addEventListener('click', newGame);

  new ResizeObserver(fit).observe(stage);
  newGame();
  VT.ready();
})();
</script>
</body>
</html>
