<!doctype html>
<html lang="en" data-voltara-game>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Block Shift — VOLTARA</title>
<link rel="stylesheet" href="../_shared/vt.css" />
<style>
  .wrap { display: grid; gap: 14px; justify-items: center; width: 100%; }
  .board { display: grid; gap: clamp(4px, 1vmin, 8px); width: var(--size); aspect-ratio: 1; }
  .cell { border: 1px solid var(--line2); border-radius: 5px; background: #0d0f11; transition: background .18s, border-color .18s, box-shadow .18s, transform .1s; position: relative; }
  .cell.on { background: #8b7dff; border-color: #a99eff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 18px rgba(139,125,255,.35); }
  .cell.on::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18%; height: 18%; transform: translate(-50%,-50%); background: rgba(255,255,255,.7); border-radius: 1px; }
  .cell.cursor { outline: 2px solid var(--lime); outline-offset: 2px; }
  .cell:active { transform: scale(.95); }
  .board.solved .cell { background: rgba(200,255,46,.15); border-color: var(--lime); }
  .tools { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="vt-app">
  <div class="vt-hud">
    <div class="vt-stat accent"><b>Level</b><span id="level">1</span></div>
    <div class="vt-stat"><b>Moves</b><span id="moves">0</span></div>
    <div class="vt-stat"><b>Par</b><span id="par">0</span></div>
    <div class="vt-spacer"></div>
    <div class="vt-stat"><b>Lit</b><span id="lit">0</span></div>
    <div class="vt-stat"><b>Best level</b><span id="best">–</span></div>
  </div>
  <div class="vt-stage" id="stage">
    <div class="vt-center">
      <div class="wrap">
        <div class="board" id="board" role="grid" aria-label="Block Shift board"></div>
        <div class="tools">
          <button class="vt-btn vt-btn--sm" id="reset">Reset board</button>
          <button class="vt-btn vt-btn--sm" id="skip">New board</button>
        </div>
      </div>
    </div>
    <div class="vt-overlay" id="ov" hidden></div>
  </div>
</div>
<script src="../_shared/vt.js"></script>
<script>
(function () {
  var board = VT.$('#board'), ov = VT.$('#ov'), stage = VT.$('#stage');
  var el = { level: VT.$('#level'), moves: VT.$('#moves'), par: VT.$('#par'), lit: VT.$('#lit'), best: VT.$('#best') };
  var n, grid, initial, moves, par, level = 1, cursor = 0, cells = [], solved = false;

  function sizeFor(l) { return l <= 3 ? 4 : l <= 6 ? 5 : l <= 10 ? 6 : 7; }

  function fit() {
    var r = stage.getBoundingClientRect();
    board.style.setProperty('--size', Math.floor(Math.min(r.width - 32, r.height - 90, 620)) + 'px');
  }
  new ResizeObserver(fit).observe(stage);

  function press(g, i) {
    var x = i % n, y = (i / n) | 0;
    [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
      var nx = x + d[0], ny = y + d[1];
      if (nx >= 0 && ny >= 0 && nx < n && ny < n) g[ny * n + nx] ^= 1;
    });
  }

  function generate() {
    n = sizeFor(level);
    var g, k;
    do {
      g = new Array(n * n).fill(0);
      k = Math.min(n * n - 2, n + Math.floor(level * 0.8) + 1);
      var picks = VT.shuffle(Array.from({ length: n * n }, function (_, i) { return i; })).slice(0, k);
      picks.forEach(function (p) { press(g, p); });
    } while (g.every(function (v) { return v === 0; }));
    grid = g; initial = g.slice(); par = k; moves = 0; solved = false;
    cursor = Math.min(cursor, n * n - 1);
    build();
  }

  function build() {
    board.innerHTML = '';
    board.classList.remove('solved');
    board.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    cells = [];
    for (var i = 0; i < n * n; i++) {
      var c = document.createElement('button');
      c.className = 'cell';
      c.dataset.i = i;
      c.tabIndex = -1;
      board.appendChild(c);
      cells.push(c);
    }
    render();
  }

  function render() {
    var lit = 0;
    for (var i = 0; i < n * n; i++) {
      cells[i].classList.toggle('on', !!grid[i]);
      cells[i].classList.toggle('cursor', i === cursor && kbd);
      cells[i].setAttribute('aria-label', 'Row ' + ((i / n | 0) + 1) + ' column ' + (i % n + 1) + (grid[i] ? ', lit' : ', dark'));
      lit += grid[i];
    }
    el.level.textContent = level; el.moves.textContent = moves; el.par.textContent = par; el.lit.textContent = lit;
    var b = VT.getBest('level'); el.best.textContent = b === null ? '–' : b;
    return lit;
  }

  var kbd = false;

  function act(i) {
    if (solved) return;
    press(grid, i); moves++;
    VT.beep(300 + (grid[i] ? 200 : 0), 0.05, 'triangle', 0.05);
    if (render() === 0) win();
  }

  function win() {
    solved = true;
    board.classList.add('solved');
    VT.beep(660, 0.1, 'triangle'); setTimeout(function () { VT.beep(990, 0.16, 'triangle'); }, 110);
    VT.submit(level, { key: 'level' });
    var rating = moves <= par ? 'Optimal route' : moves <= par * 1.5 ? 'Clean solve' : 'Solved';
    setTimeout(function () {
      VT.overlay(ov, {
        eyebrow: rating, title: 'Board clear',
        stats: [['Level', level], ['Moves', moves], ['Par', par, true]],
        button: 'Next level', onAction: function () { VT.hide(ov); level++; generate(); }, hint: 'Enter for next',
      });
    }, 350);
  }

  board.addEventListener('click', function (e) { var t = e.target.closest('.cell'); if (t) { kbd = false; act(+t.dataset.i); } });

  window.addEventListener('keydown', function (e) {
    if (!ov.hidden) { if (e.code === 'Enter' || e.code === 'Space') { var b = ov.querySelector('[data-act="main"]'); if (b) { e.preventDefault(); b.click(); } } return; }
    var x = cursor % n, y = (cursor / n) | 0, moved = true;
    if (e.code === 'ArrowLeft') x = Math.max(0, x - 1);
    else if (e.code === 'ArrowRight') x = Math.min(n - 1, x + 1);
    else if (e.code === 'ArrowUp') y = Math.max(0, y - 1);
    else if (e.code === 'ArrowDown') y = Math.min(n - 1, y + 1);
    else moved = false;
    if (moved) { kbd = true; cursor = y * n + x; render(); e.preventDefault(); }
    if (e.code === 'Enter' || e.code === 'Space') { kbd = true; e.preventDefault(); act(cursor); }
  });

  VT.$('#reset').addEventListener('click', function () { grid = initial.slice(); moves = 0; solved = false; board.classList.remove('solved'); render(); });
  VT.$('#skip').addEventListener('click', function () { generate(); });

  var saved = VT.getBest('level');
  VT.overlay(ov, {
    eyebrow: 'VOLTARA Original', title: 'Block Shift',
    sub: 'Pressing a cell flips it and its four neighbours. Turn every cell dark. Every board is generated fresh and is always solvable.',
    button: saved ? 'Continue · Level ' + (saved + 1) : 'Start', onAction: function () { VT.hide(ov); level = saved ? saved + 1 : 1; generate(); },
    secondary: saved ? { label: 'Restart at 1', onAction: function () { VT.hide(ov); level = 1; generate(); } } : null,
    hint: 'Click · Tap · Arrows + Enter',
  });
  level = 1; generate();
  VT.ready();
})();
</script>
</body>
</html>
